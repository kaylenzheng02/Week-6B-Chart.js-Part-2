<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikes vs. E-bikes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: "Geist", sans-serif;
        }

        #refreshBtn,
        #refreshBtn:hover,
        #refreshBtn:focus,
        #refreshBtn:active {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #c5ced6;
            background-color: #fff;
            color: #1f4e79;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            appearance: none;
            -webkit-appearance: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <button id="refreshBtn" type="button" aria-label="Refresh chart">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor"
                d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
    </button>
    <canvas id="bikeChart"></canvas>
    <p id="lastUpdated"></p>
    <script src="script.js"></script>
</body>
</html>
